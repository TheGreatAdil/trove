<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trove</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="main.js"></script>
</head>
<body>
<div class="app" id="app">

  <div class="scrim" data-action="toggle-sidebar"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="7.1" height="11" rx="2.6"/><rect x="0" y="12.7" width="7.1" height="3.3" rx="1.65"/><rect x="8.9" y="0" width="7.1" height="5.6" rx="2.6"/><rect x="8.9" y="7.3" width="7.1" height="8.7" rx="2.6"/></svg>
        <span class="brand-word">trove</span>
      </div>
      <button class="icon-btn" data-action="toggle-sidebar" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.25"/><path d="M6 3v10"/></svg>
      </button>
    </div>

    <div class="side-actions">
      <button class="row new-board" data-action="new-board">
        <span class="plus"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></span>
        <span class="grow">New board</span>
        <span class="kbd" data-kbd="N"></span>
      </button>
      <button class="row open-board" data-action="open-board">
        <span class="glass"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.25 4.25a1.5 1.5 0 0 1 1.5-1.5h2.6l1.4 1.5h4.5a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-8.5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span>
        <span class="grow">Open board…</span>
        <span class="kbd" data-kbd="O"></span>
      </button>
      <label class="row search">
        <span class="glass"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg></span>
        <input class="grow" id="search" type="text" placeholder="Search boards" autocomplete="off" spellcheck="false">
        <span class="kbd" data-kbd="K"></span>
      </label>
    </div>

    <nav class="side-list" id="boardList" aria-label="Boards"></nav>

    <div class="side-foot">
      <div class="lib-stat" id="libStat"></div>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle theme" title="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1Z"/></svg>
      </button>
    </div>
  </aside>

  <div class="stage" id="stage">
    <main class="scroll" id="scroll">
      <section class="grid" id="grid" aria-label="References"></section>
    </main>

    <div class="top" id="top">
      <div class="pblur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <header class="head" id="head">
        <div class="head-l">
          <div class="title-row" id="titleRow"><h1 class="title" id="title" contenteditable="true" spellcheck="false"></h1><span class="title-count" id="count"></span></div>
          <p class="meta live" id="meta"><span id="updated"></span><span class="unsaved">Unsaved changes</span><span class="sep"></span><span class="palette" id="palette" aria-label="Board palette"></span></p>
        </div>
        <div class="head-r tools" id="tools">
          <label class="density" title="Thumbnail size  (Ctrl − / Ctrl +)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="3.5" height="3.5" rx=".8"/><rect x="5.25" y="0" width="3.5" height="3.5" rx=".8"/><rect x="10.5" y="0" width="3.5" height="3.5" rx=".8"/><rect x="0" y="5.25" width="3.5" height="3.5" rx=".8"/><rect x="5.25" y="5.25" width="3.5" height="3.5" rx=".8"/><rect x="10.5" y="5.25" width="3.5" height="3.5" rx=".8"/><rect x="0" y="10.5" width="3.5" height="3.5" rx=".8"/><rect x="5.25" y="10.5" width="3.5" height="3.5" rx=".8"/><rect x="10.5" y="10.5" width="3.5" height="3.5" rx=".8"/></svg>
            <input type="range" id="density" min="150" max="440" step="1" aria-label="Thumbnail size">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="6" height="6" rx="1.2"/><rect x="8" y="0" width="6" height="6" rx="1.2"/><rect x="0" y="8" width="6" height="6" rx="1.2"/><rect x="8" y="8" width="6" height="6" rx="1.2"/></svg>
          </label>
          <span class="tools-div"></span>
          <button class="icon-btn" id="pinBtn" data-action="pin" aria-label="Keep window on top" aria-pressed="false" title="Keep window on top  (Ctrl Shift A)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5.75 2.25h4.5l-.6 4.1 2.1 2.15v1.25h-7.5V8.5l2.1-2.15z"/><path d="M8 9.75v4"/></svg>
          </button>
          <button class="icon-btn" id="boardMenuBtn" aria-label="Board options" title="Board options">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.15"/><circle cx="8" cy="8" r="1.15"/><circle cx="12.5" cy="8" r="1.15"/></svg>
          </button>
        </div>
      </header>
    </div>

    <div class="collapsed-tools">
      <button class="icon-btn" data-action="toggle-sidebar" aria-label="Open sidebar" title="Open sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.25"/><path d="M6 3v10"/></svg>
      </button>
      <button class="icon-btn" data-action="new-board" aria-label="New board" title="New board">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>

    <div class="sbar" id="sbar"><i id="sthumb"></i></div>

    <div class="empty" id="empty">
      <div class="empty-copy">
        <div class="keys" aria-hidden="true">
          <span class="key key-mod" id="keyMod"><span class="sym" id="keyModSym"></span><span class="lbl" id="keyModLbl"></span></span>
          <span class="key key-v" id="keyV"><span class="lbl">V</span></span>
        </div>
        <h2>Paste anything.</h2>
        <p>Copy an image, a screenshot or a link to one, and it lands on this board. Dropping files works too.</p>
        <button class="add-link" data-action="pick-files">Or choose files</button>
      </div>
    </div>

    <div class="dock" id="dock">
      <div class="dock-msg"><span class="dock-thumb" id="dockThumb"></span><span id="dockText">Paste an image or link</span><span class="kbd" id="dockKbd" data-kbd="V"></span></div>
      <span class="dock-sep"></span>
      <button class="dock-btn" id="dockBtn" data-action="pick-files">
        <svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>
        <span>Add</span>
      </button>
    </div>

    <div class="drop" id="drop"><div class="drop-copy"><strong>Drop to add</strong><span id="dropTo"></span></div></div>
  </div>
</div>

<div class="menu" id="menu" role="menu"></div>

<div class="focus" id="focus" aria-hidden="true">
  <div class="focus-top">
    <div><b id="focusBoard"></b>&nbsp;&nbsp;<span id="focusPos"></span></div>
    <button class="icon-btn" data-action="close-focus" aria-label="Close" title="Close (Esc)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="focus-stage">
    <button class="focus-nav prev" data-action="focus-prev" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12.5 4-6 6 6 6"/></svg></button>
    <img id="focusImg" alt="">
    <button class="focus-nav next" data-action="focus-next" aria-label="Next"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4 6 6-6 6"/></svg></button>
  </div>
  <div class="focus-bot">
    <span id="focusMeta"></span>
    <div class="actions">
      <button data-action="focus-copy"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.25" y="5.25" width="8.5" height="8.5" rx="1.75"/><path d="M10.5 2.75H4.25a1.5 1.5 0 0 0-1.5 1.5v6.25"/></svg>Copy</button>
      <button data-action="focus-delete"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.75 4.25h10.5M6.25 4.25V2.75h3.5v1.5M4.25 4.25l.6 8.4a1.5 1.5 0 0 0 1.5 1.35h3.3a1.5 1.5 0 0 0 1.5-1.35l.6-8.4"/></svg>Remove</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<input type="file" id="filePick" accept="image/*" multiple hidden>
</body>
</html>
